version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smart_expense_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: smart_expense_backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/smart_expense_tracker
      - JWT_SECRET=super_secret_jwt_key_smart_expense_tracker_2026_safe
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: smart_expense_frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  mongodb_data:
